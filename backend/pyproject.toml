[project]
name = "skin-analyzer"
version = "0.1.0"
description = "Real-time edge skin analysis and skincare recommendation backend"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",
    "mediapipe>=0.10.14",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
directml = ["onnxruntime-directml>=1.17"]
gpu = ["onnxruntime-gpu>=1.17"]
cuda = ["cupy-cuda12x>=13"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["skin_analyzer*"]

[tool.setuptools.package-data]
skin_analyzer = ["knowledge/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast isolated tests",
    "integration: multi-component tests (API, pipeline)",
]

[tool.coverage.run]
source = ["skin_analyzer"]
omit = ["skin_analyzer/preprocessing/cuda.py", "skin_analyzer/face/landmarker.py"]
